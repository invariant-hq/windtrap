name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test

      # WINDTRAP_JUNIT is the environment mirror of --junit. The value is
      # a directory (anything not ending in .xml is), so each suite writes
      # its own report instead of overwriting one file. It is absolute,
      # because dune runs each test action in that test's own build
      # directory and a relative path would scatter reports through the
      # tree.
      - name: Build and test
        run: |
          opam exec -- dune build
          opam exec -- dune build @runtest
        env:
          WINDTRAP_JUNIT: ${{ github.workspace }}/_junit

      # Failures are already annotated on the diff: the runner detects
      # GitHub Actions and emits ::error lines by itself.
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: _junit
          if-no-files-found: ignore

  # Coverage of windtrap by windtrap, on one platform: the number is a
  # property of the test suite, not of the OS. The gate lives in the
  # `self-cover` alias.
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test

      # opam's dune reports (package windtrap) as a dependency cycle when
      # windtrap is built by its own backend; see test/cli/dune.
      - name: Coverage
        run: opam exec -- dune build @self-cover --instrument-with ppx_windtrap.coverage
        env:
          SKIP_PACKAGE_SESSIONS: true
