name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test

      # The plain run, on all three platforms: uninstrumented, which is
      # what a user's `dune runtest` is. WINDTRAP_JUNIT is the environment
      # mirror of --junit; under `dune runtest` the mirrors ARE the CLI,
      # and windtrap's own CI is the obvious place to say so. The value is
      # a directory (anything not ending in .xml is), so each of the ~30
      # suites writes its own report instead of overwriting one file — and
      # it is ABSOLUTE, because dune runs each test action in that test's
      # own build directory and a relative path would scatter reports
      # through the tree.
      - name: Build and test
        run: |
          opam exec -- dune build
          opam exec -- dune build @runtest
        env:
          WINDTRAP_JUNIT: ${{ github.workspace }}/_junit

      # Failures are already annotated on the diff: the runner detects
      # GitHub Actions and emits ::error lines by itself. The JUnit files
      # are for the run summary and for anything that consumes them.
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: _junit
          if-no-files-found: ignore

  # Coverage of windtrap by windtrap, on one platform: the number is a
  # property of the test suite, not of the OS. The gate lives in the
  # `self-cover` alias; see doc/dev/testing.md, "Windtrap under its own
  # instrumentation".
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test

      - name: Coverage
        run: opam exec -- dune build @self-cover --instrument-with ppx_windtrap.coverage
